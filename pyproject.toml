[project]
name = "curriculum-generator"
version = "0.1.0"
description = "Generate customized CVs and cover letters using a local LLM (llama.cpp) based on job descriptions and user profiles."
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "markupsafe>=2.1",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "weasyprint>=62",
]

[project.scripts]
curriculum-generator = "curriculum_generator.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["curriculum_generator"]
